<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#a6b4ab" />
  <meta name="description" content="Sweet Day - New York Cookies Style" />
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Sweet Day Costa Rica</title>
  <style>
    :root {
      --bg: #a6b4ab;
      --focus: rgba(255, 255, 255, 0.96);
      --shadow: rgba(41, 29, 21, 0.16);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(14px, 2.6vw, 28px);
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
    }

    .landing {
      width: min(100%, 1400px);
    }

    .artwork-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2277 / 1280;
      border-radius: 0;
      overflow: hidden;
      box-shadow: 0 18px 40px var(--shadow);
      background: var(--bg);
    }

    .artwork {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }

    .hotspot {
      position: absolute;
      display: block;
      border-radius: 999px;
      text-indent: -9999px;
      overflow: hidden;
      background: transparent;
    }

    .hotspot:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
      box-shadow: 0 0 0 6px rgba(113, 58, 19, 0.32);
    }

    /*
      Los botones siguen la posición exacta del arte original.
      Reemplaza los href con tus links reales.
    */
    .whatsapp { left: 71.8%; top: 78.2%; width: 7.2%; height: 11.8%; }
    .email    { left: 79.1%; top: 78.2%; width: 7.2%; height: 11.8%; }
    .instagram{ left: 86.5%; top: 78.2%; width: 7.2%; height: 11.8%; }

    @media (max-width: 700px) {
      body { padding: 10px; }
      .landing { width: 100%; }
  </style>
</head>
